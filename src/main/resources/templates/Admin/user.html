<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add User</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/wingway-admin.css}" href="../../static/css/wingway-admin.css">
</head>
<body class="admin-body">
<div class="admin-shell">
    <nav class="admin-nav">
        <a class="admin-brand" th:href="@{/api/v1/demo-controller/admin/getAllUsers}">
            <span class="admin-brand-mark"><i class="fa-solid fa-plane"></i></span>
            <span><strong>WingWay</strong><small>Admin Control</small></span>
        </a>
        <div class="admin-links">
            <a th:href="@{/api/v1/demo-controller/admin/getAllUsers}"><i class="fa-solid fa-users"></i><span>Users</span></a>
            <a th:href="@{/api/v1/demo-controller/admin/flights}"><i class="fa-solid fa-plane-departure"></i><span>Flights</span></a>
            <a th:href="@{/api/v1/demo-controller/admin/bookings}"><i class="fa-solid fa-ticket"></i><span>Bookings</span></a>
            <a class="active" th:href="@{/api/v1/demo-controller/admin/users/new}"><i class="fa-solid fa-user-plus"></i><span>Add User</span></a>
        </div>
        <a class="admin-logout" th:href="@{/api/v1/auth/logout}"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
    </nav>

    <main class="admin-main">
        <section class="admin-hero admin-hero-add-user">
            <div>
                <span class="admin-eyebrow"><i class="fa-solid fa-user-shield"></i> Access Setup</span>
                <h1>Create a new WingWay account.</h1>
                <p>Add a passenger or trusted operator account and choose the role it should receive.</p>
            </div>
            <div class="admin-actions">
                <a class="admin-button-secondary" th:href="@{/api/v1/demo-controller/admin/getAllUsers}"><i class="fa-solid fa-arrow-left"></i>View Users</a>
            </div>
        </section>

        <section class="admin-panel">
            <div class="admin-panel-head">
                <div>
                    <h2>Add User</h2>
                    <p th:if="${message}" th:text="${message}">Message</p>
                    <p th:unless="${message}">Select whether this account should be a passenger user or an admin.</p>
                </div>
            </div>
            <form class="admin-form" th:action="@{/api/v1/demo-controller/admin/users}" th:object="${registerRequest}" method="post">
                <div class="admin-form-grid">
                    <div class="admin-field">
                        <label for="firstname">First Name</label>
                        <input id="firstname" type="text" th:field="*{firstname}" required>
                    </div>
                    <div class="admin-field">
                        <label for="lastname">Last Name</label>
                        <input id="lastname" type="text" th:field="*{lastname}" required>
                    </div>
                    <div class="admin-field">
                        <label for="email">Email</label>
                        <input id="email" type="email" th:field="*{email}" required>
                    </div>
                    <div class="admin-field">
                        <label for="password">Password</label>
                        <input id="password" type="password" th:field="*{password}" required>
                    </div>
                    <div class="admin-field">
                        <label for="role">Role</label>
                        <select id="role" th:field="*{role}" required>
                            <option value="ROLE_USER">User</option>
                            <option value="ROLE_ADMIN">Admin</option>
                        </select>
                    </div>
                </div>
                <div class="admin-form-actions">
                    <button class="admin-button" type="submit"><i class="fa-solid fa-user-plus"></i>Add User</button>
                    <a class="admin-button-secondary" th:href="@{/api/v1/demo-controller/admin/getAllUsers}">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</div>
<script src="../../static/js/auth.js" th:src="@{/js/auth.js}"></script>
</body>
</html>
