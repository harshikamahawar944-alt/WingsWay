<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Seats</title>
  <link rel="stylesheet" th:href="@{/css/ticket.css}" href="../../static/css/ticket.css">
</head>
<body>
  <div class="ticket-shell">
    <div class="container">
      <div class="flight-summary">
        <div>
          <p class="eyebrow">Seat Selection</p>
          <h1 id="flightTitle">Choose your seats</h1>
          <p id="flightMeta"></p>
          <p id="classBadge" class="class-badge"></p>
        </div>
        <div class="legend">
          <span><i class="seat seat-free"></i> Available</span>
          <span><i class="seat seat-taken"></i> Unavailable</span>
          <span><i class="seat seat-selected"></i> Selected</span>
        </div>
      </div>

      <div class="seat-layout">
        <div class="cockpit">Cockpit</div>
        <div id="cabinHint" class="cabin-hint"></div>
        <div id="seatMap" class="seat-map"></div>
      </div>

      <div class="ticket-selection">
        <h2>Selection Summary</h2>
        <p id="seatSummary">Choose your seats to continue.</p>
        <p id="seatPrice"></p>
        <form id="ticket-selection-form" th:action="@{/api/v1/auth/payment}" method="get">
          <button type="submit" class="buttonsub">Proceed to Payment</button>
        </form>
      </div>
    </div>
  </div>
  <script src="../../static/js/ticket.js" th:src="@{/js/ticket.js}"></script>
</body>
</html>
