<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airline Reservation Payment</title>
  <link rel="stylesheet" th:href="@{/css/payment.css}" href="../../static/css/payment.css">
</head>
<body>
  <div class="payment-shell">
    <div class="container">
      <div class="booking-details">
        <h1>Payment Information</h1>
        <h2>Trip Summary</h2>
        <p><strong>Airline:</strong> <span id="airline"></span></p>
        <p><strong>Flight Number:</strong> <span id="flight-number"></span></p>
        <p><strong>Route:</strong> <span id="route"></span></p>
        <p><strong>Class:</strong> <span id="class-type"></span></p>
        <p><strong>Departure:</strong> <span id="departure-time"></span></p>
        <p><strong>Seats:</strong> <span id="seat-list"></span></p>
        <p><strong>No. of Tickets:</strong> <span id="ticket-count"></span></p>
        <p><strong>Total Price:</strong> <span id="ticket-price"></span></p>
      </div>

      <div class="payment-method" id="paymentPanel">
        <h2>Payment Method</h2>
        <form id="payment-form">
          <label for="card-holder">Card Holder's Name</label>
          <input type="text" id="card-holder" required>

          <label for="card-number">Card Number</label>
          <input type="text" id="card-number" required>

          <label for="expiry-date">Expiry Date</label>
          <input type="text" id="expiry-date" placeholder="MM/YY" required>

          <label for="cvv">CVV</label>
          <input type="text" id="cvv" required>

          <button class="buttonsub" type="submit">Pay Now</button>
          <p id="payment-status"></p>
        </form>
      </div>

      <div class="confirmation-card" id="confirmationCard" hidden>
        <p class="eyebrow">Payment Successful</p>
        <h2>Your booking is confirmed</h2>
        <p id="confirmationMessage"></p>
        <div id="printableTicket" class="printable-ticket"></div>
        <div class="confirmation-actions">
          <button class="buttonsub" id="printTicketBtn" type="button">Print Ticket</button>
          <a class="buttonsub secondary" th:href="@{/api/v1/auth/confirmation}" id="viewTicketBtn">View Ticket</a>
          <a class="buttonsub secondary" th:href="@{/api/v1/demo-controller/user/my-bookings}">My Bookings</a>
          <a class="buttonsub secondary" th:href="@{/api/v1/auth/index}">Back Home</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../../static/js/auth.js" th:src="@{/js/auth.js}"></script>
  <script src="../../static/js/payment.js" th:src="@{/js/payment.js}"></script>
</body>
</html>
