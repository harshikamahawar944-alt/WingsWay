<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printable Ticket</title>
  <link rel="stylesheet" th:href="@{/css/payment.css}" href="../../static/css/payment.css">
</head>
<body>
  <div class="payment-shell">
    <div class="container">
      <div class="confirmation-card">
        <p class="eyebrow">Printable Ticket</p>
        <h1>Booking Confirmation</h1>
        <div id="confirmationStandalone"></div>
        <div class="confirmation-actions">
          <button class="buttonsub" onclick="window.print()" type="button">Print Ticket</button>
          <a class="buttonsub secondary" th:href="@{/api/v1/demo-controller/user/my-bookings}">My Bookings</a>
          <a class="buttonsub secondary" th:href="@{/api/v1/auth/index}">Back Home</a>
        </div>
      </div>
    </div>
  </div>
  <script type="text/javascript">
    const confirmation = JSON.parse(localStorage.getItem('bookingConfirmation') || 'null');
    const target = document.getElementById('confirmationStandalone');
    if (!confirmation) {
      target.innerHTML = '<p>No printable ticket found. Complete a booking first.</p>';
    } else {
      target.innerHTML = `
        <div class="printable-ticket">
          <p><strong>Booking Ref:</strong> ${confirmation.bookingReference}</p>
          <p><strong>Passenger:</strong> ${confirmation.passengerName}</p>
          <p><strong>Airline:</strong> ${confirmation.airline}</p>
          <p><strong>Flight:</strong> ${confirmation.flightNumber}</p>
          <p><strong>Route:</strong> ${confirmation.route}</p>
          <p><strong>Class:</strong> ${confirmation.classType}</p>
          <p><strong>Departure:</strong> ${confirmation.departureTime}</p>
          <p><strong>Seats:</strong> ${confirmation.seats}</p>
          <p><strong>Total Paid:</strong> ${confirmation.price}</p>
        </div>
      `;
    }
  </script>
</body>
</html>
